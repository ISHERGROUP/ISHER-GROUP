<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEET 2026 Notes - ISHER GROUP</title><link rel="stylesheet" href="style.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><main class="home"><div class="card wide-card"><h1 id="subjectTitle">Notes</h1><p id="subjectText">Choose a section</p><div id="categoryList" class="buttons subject-buttons"></div><div id="chapterList" class="chapter-list"></div><a class="back" href="notes.html">← Choose Another Subject</a></div></main><script>
const RAZORPAY_KEY_ID='rzp_test_TQqxKkTxBh1AhW';const params=new URLSearchParams(location.search),subject=params.get('subject'),category=params.get('category');
const data={physics:{title:'Physics',categories:{'Physics and Measurement':['Physics and Measurement','Kinematics','Laws of Motion'],'Mechanics':['Work, Energy and Power','Rotational Motion','Gravitation'],'Properties of Matter':['Properties of Solids and Liquids','Thermodynamics','Kinetic Theory of Gases'],'Oscillations and Waves':['Oscillations and Waves'],'Electrostatics':['Electric Charges and Fields','Electrostatic Potential and Capacitance'],'Current Electricity':['Current Electricity'],'Magnetic Effects':['Moving Charges and Magnetism','Magnetism and Matter'],'Electromagnetic Induction':['Electromagnetic Induction','Alternating Current'],'Electromagnetic Waves':['Electromagnetic Waves'],'Optics':['Ray Optics and Optical Instruments','Wave Optics'],'Modern Physics':['Dual Nature of Matter and Radiation','Atoms and Nuclei','Electronic Devices'],'Experimental Skills':['Experimental Skills']}},chemistry:{title:'Chemistry',categories:{'Physical Chemistry':['Some Basic Concepts in Chemistry','Atomic Structure','Chemical Bonding and Molecular Structure','Chemical Thermodynamics','Solutions','Equilibrium','Redox Reactions and Electrochemistry','Chemical Kinetics'],'Inorganic Chemistry':['Classification of Elements and Periodicity in Properties','P-Block Elements','D- and F-Block Elements','Coordination Compounds'],'Organic Chemistry':['Purification and Characterisation of Organic Compounds','Some Basic Principles of Organic Chemistry','Hydrocarbons','Organic Compounds Containing Halogens','Organic Compounds Containing Oxygen','Organic Compounds Containing Nitrogen','Biomolecules','Principles Related to Practical Chemistry']}},biology:{title:'Biology',categories:{'Botany':['Diversity in Living World','Structural Organisation in Animals and Plants','Cell Structure and Function','Plant Physiology','Sexual Reproduction in Flowering Plants','Principles of Inheritance and Variation','Molecular Basis of Inheritance','Biotechnology: Principles and Processes','Biotechnology and Its Applications','Ecology and Environment','Plant Kingdom'],'Zoology':['Animal Kingdom','Structural Organisation in Animals and Plants','Human Physiology','Human Reproduction','Reproductive Health','Principles of Inheritance and Variation','Molecular Basis of Inheritance','Evolution','Human Health and Disease','Microbes in Human Welfare','Biotechnology: Principles and Applications','Ecology and Environment']}}};
const productMap={'biology|Botany|Cell Structure and Function':{id:'cell-biology',demo:'demo-view.html'}};
const subjectData=data[subject],categoryList=document.getElementById('categoryList'),chapterList=document.getElementById('chapterList');document.getElementById('subjectTitle').textContent=subjectData?subjectData.title:'Notes';
async function payForNote(productId){try{const r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId})});const o=await r.json();if(!r.ok)throw new Error(o.error||'Could not create order');new Razorpay({key:RAZORPAY_KEY_ID,amount:o.amount,currency:o.currency,name:'ISHER GROUP',description:o.title,order_id:o.id,handler:async p=>{const vr=await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,productId:o.productId,proof:o.proof})}),x=await vr.json();if(vr.ok&&x.success)location.href='success.html?token='+encodeURIComponent(x.token)+'&title='+encodeURIComponent(x.title);else alert(x.error||'Payment verification failed.');},theme:{color:'#7c3aed'}}).open();}catch(e){alert(e.message||'Payment could not be started.')}}
if(!subjectData){document.getElementById('subjectText').textContent='Please choose a subject first.';}else if(!category){document.getElementById('subjectText').textContent=subject==='chemistry'?'Choose Chemistry section':subject==='biology'?'Choose Biology section':'Choose Physics unit';categoryList.innerHTML=Object.keys(subjectData.categories).map(n=>`<a class="btn subject" href="subject.html?subject=${subject}&category=${encodeURIComponent(n)}">${n}</a>`).join('');}else{const chapters=subjectData.categories[category]||[];document.getElementById('subjectText').textContent=`${category} — NEET UG 2026 syllabus`;chapterList.innerHTML=chapters.map((c,i)=>{const product=productMap[`${subject}|${category}|${c}`];const actions=product?`<div class="note-actions"><a class="small-btn" href="${product.demo}">Demo View</a><button class="small-btn pay-btn" type="button" onclick="payForNote('${product.id}')">Pay &amp; Get</button></div>`:`<span class="small-btn" style="opacity:.65;cursor:default">Notes</span>`;return `<div class="chapter-card"><span>${i+1}. ${c}</span>${actions}</div>`;}).join('');categoryList.innerHTML=`<a class="btn subject" href="subject.html?subject=${subject}">← Back to Sections</a>`;}
</script></body></html>
