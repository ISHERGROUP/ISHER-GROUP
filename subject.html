<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEET 2026 Notes - ISHER GROUP</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <main class="home">
    <div class="card wide-card">
      <h1 id="subjectTitle">Notes</h1>
      <p id="subjectText">Choose a section</p>
      <div id="categoryList" class="buttons subject-buttons"></div>
      <div id="chapterList" class="chapter-list"></div>
      <a class="back" href="notes.html">← Choose Another Subject</a>
    </div>
  </main>

  <script>
    const RAZORPAY_KEY_ID = 'rzp_test_TQqxKkTxBh1AhW';
    const params = new URLSearchParams(window.location.search);
    const subject = params.get('subject');
    const category = params.get('category');

    const data = {
      physics: { title: 'Physics', categories: {
        'Physics and Measurement': ['Physics and Measurement', 'Kinematics', 'Laws of Motion'],
        'Mechanics': ['Work, Energy and Power', 'Rotational Motion', 'Gravitation'],
        'Properties of Matter': ['Properties of Solids and Liquids', 'Thermodynamics', 'Kinetic Theory of Gases'],
        'Oscillations and Waves': ['Oscillations and Waves'], 'Electrostatics': ['Electric Charges and Fields', 'Electrostatic Potential and Capacitance'],
        'Current Electricity': ['Current Electricity'], 'Magnetic Effects': ['Moving Charges and Magnetism', 'Magnetism and Matter'],
        'Electromagnetic Induction': ['Electromagnetic Induction', 'Alternating Current'], 'Electromagnetic Waves': ['Electromagnetic Waves'],
        'Optics': ['Ray Optics and Optical Instruments', 'Wave Optics'], 'Modern Physics': ['Dual Nature of Matter and Radiation', 'Atoms and Nuclei', 'Electronic Devices'], 'Experimental Skills': ['Experimental Skills']
      }},
      chemistry: { title: 'Chemistry', categories: {
        'Physical Chemistry': ['Some Basic Concepts in Chemistry', 'Atomic Structure', 'Chemical Bonding and Molecular Structure', 'Chemical Thermodynamics', 'Solutions', 'Equilibrium', 'Redox Reactions and Electrochemistry', 'Chemical Kinetics'],
        'Inorganic Chemistry': ['Classification of Elements and Periodicity in Properties', 'P-Block Elements', 'D- and F-Block Elements', 'Coordination Compounds'],
        'Organic Chemistry': ['Purification and Characterisation of Organic Compounds', 'Some Basic Principles of Organic Chemistry', 'Hydrocarbons', 'Organic Compounds Containing Halogens', 'Organic Compounds Containing Oxygen', 'Organic Compounds Containing Nitrogen', 'Biomolecules', 'Principles Related to Practical Chemistry']
      }},
      biology: { title: 'Biology', categories: {
        'Botany': ['Diversity in Living World', 'Structural Organisation in Animals and Plants', 'Cell Structure and Function', 'Plant Physiology', 'Sexual Reproduction in Flowering Plants', 'Principles of Inheritance and Variation', 'Molecular Basis of Inheritance', 'Biotechnology: Principles and Processes', 'Biotechnology and Its Applications', 'Ecology and Environment', 'Plant Kingdom'],
        'Zoology': ['Animal Kingdom', 'Structural Organisation in Animals and Plants', 'Human Physiology', 'Human Reproduction', 'Reproductive Health', 'Principles of Inheritance and Variation', 'Molecular Basis of Inheritance', 'Evolution', 'Human Health and Disease', 'Microbes in Human Welfare', 'Biotechnology: Principles and Applications', 'Ecology and Environment']
      }}
    };

    const subjectData = data[subject];
    document.getElementById('subjectTitle').textContent = subjectData ? subjectData.title : 'Notes';
    const categoryList = document.getElementById('categoryList');
    const chapterList = document.getElementById('chapterList');

    async function payForCellBiology() {
      try {
        const response = await fetch('/api/create-order', { method: 'POST' });
        const order = await response.json();
        if (!response.ok) throw new Error(order.error || 'Could not create order');

        const options = {
          key: RAZORPAY_KEY_ID,
          amount: order.amount,
          currency: order.currency,
          name: 'ISHER GROUP',
          description: 'Cell Biology Notes',
          order_id: order.id,
          handler: async function (payment) {
            const verifyResponse = await fetch('/api/verify-payment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payment)
            });
            const result = await verifyResponse.json();
            if (verifyResponse.ok && result.success) {
              window.location.href = 'success.html';
            } else {
              alert('Payment verification failed. Please contact support.');
            }
          },
          theme: { color: '#7c3aed' }
        };
        new Razorpay(options).open();
      } catch (error) {
        alert(error.message || 'Payment could not be started.');
      }
    }

    if (!subjectData) {
      document.getElementById('subjectText').textContent = 'Please choose a subject first.';
    } else if (!category) {
      document.getElementById('subjectText').textContent = subject === 'chemistry' ? 'Choose Chemistry section' : subject === 'biology' ? 'Choose Biology section' : 'Choose Physics unit';
      categoryList.innerHTML = Object.keys(subjectData.categories).map(name => `<a class="btn subject" href="subject.html?subject=${subject}&category=${encodeURIComponent(name)}">${name}</a>`).join('');
    } else {
      const chapters = subjectData.categories[category] || [];
      document.getElementById('subjectText').textContent = `${category} — NEET UG 2026 syllabus`;
      chapterList.innerHTML = chapters.map((chapter, index) => {
        const isCellBiology = subject === 'biology' && category === 'Botany' && chapter === 'Cell Structure and Function';
        if (isCellBiology) {
          return `<div class="chapter-card"><span>${index + 1}. ${chapter}</span><div class="note-actions"><a class="small-btn" href="biology-cell-notes.pdf" target="_blank" rel="noopener">Demo View</a><button class="small-btn pay-btn" type="button" onclick="payForCellBiology()">Pay &amp; Get</button></div></div>`;
        }
        return `<div class="chapter-card"><span>${index + 1}. ${chapter}</span><a class="small-btn" href="#">Notes</a></div>`;
      }).join('');
      categoryList.innerHTML = `<a class="btn subject" href="subject.html?subject=${subject}">← Back to Sections</a>`;
    }
  </script>
</body>
</html>
